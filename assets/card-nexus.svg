<rect x="2" y="2" width="436" height="266" rx="12" fill="#070a1f" fill-opacity=".95" stroke="#00F0FF" stroke-opacity=".35" stroke-width="1.4"/><rect x="2" y="2" width="436" height="266" rx="12" fill="none" stroke="#00F0FF" stroke-width="2.4" stroke-dasharray="140 1280" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-1420" dur="7s" repeatCount="indefinite"/></rect><g transform="translate(388,50)"><circle r="20" fill="none" stroke="#00F0FF" stroke-opacity=".5" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle><circle r="9" fill="none" stroke="#00F0FF" stroke-width="1.6"/><circle r="3" fill="#00F0FF"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle></g><text x="26" y="34" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#00F0FF" opacity=".85" letter-spacing="2">SIDE ORBIT</text><text x="26" y="68" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="24" font-weight="800" fill="#E6F7FF">NEXUS EXCHANGE</text><text x="26" y="104" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#E6F7FF" opacity=".82">Crypto exchange: real-time market data, wallets,</text><text x="26" y="125" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#E6F7FF" opacity=".82">WebAuthn passkeys, AI fraud engine, scheduled</text><text x="26" y="146" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#E6F7FF" opacity=".82">transfers and KYC via multimodal AI.</text><g transform="translate(26,226)"><rect width="58" height="24" rx="5" fill="#00F0FF" fill-opacity=".12" stroke="#00F0FF" stroke-opacity=".7"/><text x="29" y="16" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#00F0FF">Flask</text></g><g transform="t