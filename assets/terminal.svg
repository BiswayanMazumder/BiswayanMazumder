 fill="#3DFFA2" clip-path="url(#c3)" xml:space="preserve">[ OK ] fraud-ai ............. scanning, 0 anomalies</text><clipPath id="c4"><rect x="28" y="190" height="26" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;318;318" keyTimes="0;0.440;0.510;1"/></rect></clipPath><text x="28" y="208" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#3DFFA2" clip-path="url(#c4)" xml:space="preserve">[ OK ] webauthn passkeys .... armed</text><clipPath id="c5"><rect x="28" y="224" height="26" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;519;519" keyTimes="0;0.540;0.610;1"/></rect></clipPath><text x="28" y="242" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#FFB547" clip-path="url(#c5)" xml:space="preserve">[ &gt;&gt; ] agents collecting packets, scrambling payloads ...</text><clipPath id="c6"><rect x="28" y="258" height="26" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;464;464" keyTimes="0;0.640;0.710;1"/></rect></clipPath><text x="28" y="276" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#00F0FF" clip-path="url(#c6)" xml:space="preserve">$ whoami  -&gt;  flutter + backend + security engineer</text><rect x="28" y="294" width="10" height="18" fill="#00F0FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
